# Runs in the public lythos-labs mirror, where this folder is the repository root. The monorepo ignores it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        experiment: [brand-lab, mail-check, compose-lab]
    defaults:
      run:
        working-directory: ${{ matrix.experiment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
